</head>
<body class="hubmode">
<div class="wrap">
  <main id="app"><div class="boot" aria-hidden="true"><div class="boot-sky"></div><div class="boot-row"><i></i><i></i><i></i></div></div></main>
</div>

  <button data-hub="cal"><b>◷</b>Calendario</button>
  <button data-hub="tareas"><b>☑</b>Tareas</button>
  <button data-hub="cuaderno"><b>▤</b>Cuaderno</button>
  <button data-hub="mas"><b class="ms-dots">•••</b>Más</button>
</nav>

<script src="iconos-data.js"></script>
<script src="iconos.js"></script>
<script src="engine.js"></script>
<script src="sync.js"></script>
<script src="ui.js"></script>
<script src="core.js"></script>

<script src="hub.js"></script>
<script src="trabajo.js"></script>
<script src="festivos.js"></script>
<script src="tiempo.js"></script>
<script src="rapido.js"></script>
<script src="calendario.js"></script>

<script src="avisos.js"></script>
<script src="efemerides.js"></script>
<script src="planes.js"></script>
<script src="barcelona.js"></script>

<script src="mejoras.js"></script>
<script src="viajes.js"></script>
<script src="mas2.js"></script>
<script src="apple.js"></script>
<script>
'use strict';
// Mi Espacio. Tus cuentas viven aparte, en Rumbo (rumbo/), con su PIN; aquí no se ve ninguna cifra.
const HUB = ['inicio', 'cal', 'tareas', 'cuaderno', 'apple', 'espacio', 'ciudad', 'noticias', 'viajes', 'mas'];
function openRumbo(t) { location.href = 'rumbo/' + (t && t !== 'hoy' ? '#' + t : ''); }
function render() {
  if (FIN_TABS.includes(tab)) { const t = tab; tab = 'inicio'; return openRumbo(t); }
  if (!HUB.includes(tab)) tab = 'inicio';
  document.body.classList.toggle('nbmode', tab === 'cuaderno');
  document.body.classList.add('hubmode');
  document.getElementById('hubnav').classList.remove('hidden');
  document.querySelectorAll('#hubnav [data-hub]').forEach(b => b.classList.toggle('on', b.dataset.hub === tab));
  paintSync();
  document.getElementById('app').innerHTML = ({ cuaderno: vCuaderno, inicio: vInicio, cal: vCal, apple: vApple, espacio: vEspacio, ciudad: vCiudad, tareas: vTareas, noticias: vNoticias, viajes: vViajes, mas: vMas })[tab]();
  bind();
}
const goTab = t => { tab = t; render(); scrollTo(0, 0); };
document.querySelectorAll('#hubnav [data-hub]').forEach(b => b.onclick = () => goTab(b.dataset.hub));
document.addEventListener('click', e => {
  const r = e.target.closest('[data-rumbo]'); if (r) { e.preventDefault(); return openRumbo(r.dataset.rumbo); }
  if (e.target.closest('[data-rumbocopy]')) { e.preventDefault(); openRumboMove(); }
  if (e.target.closest('[data-sync]')) { e.preventDefault(); goTab('espacio'); setTimeout(() => { const el = document.getElementById('sincronizar'); if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' }); }, 60); }
});

function bind() {
  const $ = id => document.getElementById(id);
  document.querySelectorAll('[data-go]').forEach(el => el.onclick = e => { e.preventDefault(); goTab(el.dataset.go); });
  document.querySelectorAll('[data-set]').forEach(el => el.onchange = () => { set('settings', el.dataset.set, el.value); save(); render(); });
  document.querySelectorAll('[data-vacleft]').forEach(el => el.onchange = () => { const n = parseInt(el.value, 10); if (isNaN(n)) return; const t = todayISO(); set('settings', 'vacLeft', { y: +t.slice(0, 4), n, at: t }); save(); render(); });
  bindSync(); bindCuaderno(); bindHub(); bindWork(); bindCiudad(); bindTareas(); if (tab === 'viajes') bindViajes(); if (tab === 'apple' || tab === 'cal' || tab === 'inicio') bindApple();
  if ($('impb')) { $('impb').onclick = () => $('bfile').click(); $('bfile').onchange = async e => { try { restoreBackup(JSON.parse(await e.target.files[0].text())); } catch (_) { toast('Ese archivo no es una copia válida.'); } }; }
}
// ---------- llevar tus cuentas a Rumbo como app aparte ----------
function openRumboMove() {
  const box = document.createElement('div'); box.className = 'sheet-veil'; box.id = 'rmove';
  box.innerHTML = `<div class="sheet rm-sheet" role="dialog" aria-label="Instalar Rumbo"><div class="sheet-grab"></div>
    <div class="rm-hero"><img src="rumbo/icons/icon-180.png" alt="" width="64" height="64"><div><b>Rumbo</b><small>Tus cuentas, en una app aparte y con PIN</small></div></div>
    <ol class="rm-steps">
      <li><b>Copia tus datos</b><span>Movimientos, saldos, fijos y deudas. Van comprimidos en un texto.</span><button id="rmcopy" class="primary">${ico('copy')} Copiar mis datos</button></li>
      <li><b>Abre Rumbo en Safari</b><span>Toca el botón y, en Safari, Compartir › <b>Añadir a pantalla de inicio</b>.</span><a class="btn" href="rumbo/" target="_blank" rel="noopener">${ico('arrow-up-right')} Abrir Rumbo</a></li>
      <li><b>Pégalos en Rumbo</b><span>Al abrirla por primera vez, toca <b>Traer mis datos de Mi Espacio</b>. Te pedirá tu PIN de siempre.</span></li>
    </ol>
    <p class="small muted">En el ordenador no hace falta nada de esto: las dos apps ya comparten los datos. Si tienes la sincronización activada, tampoco: vincula Rumbo con el QR y le llega todo solo.</p>
    <div class="sheet-acts"><span style="flex:1"></span><button id="rmx">Cerrar</button></div></div>`;
  document.body.appendChild(box);
  const close = () => box.remove();
  box.onclick = e => { if (e.target === box) close(); };
  document.getElementById('rmx').onclick = close;
  document.getElementById('rmcopy').onclick = async () => {
    try { await navigator.clipboard.writeText(await moneyPack()); toast('Copiado. Ahora abre Rumbo y pégalo.'); }
    catch (e) { toast('No he podido copiar. Prueba otra vez tocando el botón.'); }
  };
}

render();
if (/^#(cuaderno|cal)$/.test(location.hash)) { const t = location.hash.slice(1); history.replaceState(null, '', location.pathname); goTab(t); }
if (/^#vincular=/.test(location.hash)) { const code = location.hash; history.replaceState(null, '', location.pathname); linkWith(code); }
else doSync();
wxFetch(); appsFetch();
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  const hadCtrl = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadCtrl && !reloaded) { reloaded = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {});
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
</script>
</body>
</html>
